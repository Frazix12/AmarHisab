name: eas-android-local-build-bun

on:
  push:
    branches: [main]

jobs:
  build-android:
    runs-on: ubuntu-latest

    env:
      # Expo / EAS authentication (robot token)
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      # App runtime env vars
      EXPO_PUBLIC_ELEVENLABS_API_KEY: ${{ secrets.EXPO_PUBLIC_ELEVENLABS_API_KEY }}
      EXPO_PUBLIC_GEMINI_API_KEY: ${{ secrets.EXPO_PUBLIC_GEMINI_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Java is required for Android builds
      - name: Setup Java (Temurin 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Android SDK (no Android Studio needed)
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # Accept all Android SDK licenses explicitly
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      # Install Bun
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Install JS dependencies via Bun
      - name: Install dependencies (Bun)
        run: bun install --frozen-lockfile

      # Install EAS CLI (global)
      - name: Install EAS CLI
        run: bun add -g eas-cli

      # Optional sanity check (won’t fail the build)
      - name: Expo doctor
        run: bunx expo-doctor || true

      # Local Android build via EAS
      - name: EAS Build (Android, local)
        run: |
          eas build --platform android --profile preview --local --non-interactive --output ${{ github.workspace }}/app-release.apk

      # Upload the generated APK
      - name: Upload APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: app-release.apk
          path: app-release.apk
