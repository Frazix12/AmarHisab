# .github/workflows/android-preview-release.yml
name: Build Android Preview APK (Bun) and Publish Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.2.3-preview.1). Leave empty to auto-generate."
        required: false
        default: ""
      prerelease:
        description: "Mark as prerelease"
        required: false
        default: "true"
      release_name:
        description: "Release name (optional)"
        required: false
        default: ""
  push:
    tags:
      - "v*-preview*"

permissions:
  contents: write

concurrency:
  group: android-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "latest"

      - name: Install dependencies (Bun)
        run: bun install --frozen-lockfile

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # Optional: If your project requires specific build-tools/ndk, uncomment and adjust:
      # - name: Install Android components
      #   run: |
      #     sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Install EAS CLI (global)
        run: bun add -g eas-cli

      # Export EXPO_PUBLIC_* secrets as env vars for the build.
      # These will be embedded into the JS bundle (by design for EXPO_PUBLIC_ vars).
      - name: Build APK locally with EAS (preview)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_ELEVENLABS_API_KEY: ${{ secrets.EXPO_PUBLIC_ELEVENLABS_API_KEY }}
          EXPO_PUBLIC_GEMINI_API_KEY: ${{ secrets.EXPO_PUBLIC_GEMINI_API_KEY }}
        run: |
          mkdir -p apk
          eas build \
            --platform android \
            --profile preview \
            --local \
            --non-interactive \
            --output ./apk/app-preview.apk

          echo "Built file:"
          ls -lh ./apk/app-preview.apk

      # ✅ Artifact for Actions (download from workflow run)
      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-preview-apk
          path: apk/app-preview.apk
          if-no-files-found: error
          retention-days: 14

      - name: Compute tag
        id: tag
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v0.0.0-preview.${GITHUB_RUN_NUMBER}"
          fi
          echo "value=$TAG" >> "$GITHUB_OUTPUT"
          echo "Computed tag: $TAG"

      - name: Compute release name
        id: relname
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.release_name }}" ]; then
            NAME="${{ github.event.inputs.release_name }}"
          else
            NAME="${{ steps.tag.outputs.value }}"
          fi
          echo "value=$NAME" >> "$GITHUB_OUTPUT"

      # ✅ GitHub Release asset (shows under Releases)
      - name: Create GitHub Release and upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.value }}
          name: ${{ steps.relname.outputs.value }}
          prerelease: ${{ github.event.inputs.prerelease || 'true' }}
          generate_release_notes: true
          files: |
            apk/app-preview.apk
