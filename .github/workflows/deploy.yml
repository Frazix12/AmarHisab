name: Expo CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  check-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed for creating GitHub Releases

    steps:
      - name: 🏗 Setup repo
        uses: actions/checkout@v4

      - name: 🏗 Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 💾 Restore Bun and node_modules cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock', 'package.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: 📦 Install dependencies
        run: bun install --frozen-lockfile

      - name: 🏗 Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: 18.0.4
          eas-cache: true
          expo-cache: true
          packager: bun
          patch-watchers: false
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 🧬 Compute EAS Fingerprint
        id: fingerprint
        run: |
          set -euo pipefail
          FINGERPRINT=$(eas fingerprint:generate --platform android --json --non-interactive | jq -r '.hash')
          if [ -z "$FINGERPRINT" ] || [ "$FINGERPRINT" = "null" ]; then
            echo "Failed to compute fingerprint hash"
            exit 1
          fi
          echo "Native fingerprint hash: $FINGERPRINT"
          echo "hash=$FINGERPRINT" >> $GITHUB_OUTPUT

      - name: 🔎 Check for existing build on EAS
        id: check-build
        run: |
          set -euo pipefail
          FINGERPRINT_HASH="${{ steps.fingerprint.outputs.hash }}"
          if ! BUILD_JSON=$(eas build:list --platform android --status finished --fingerprint-hash "$FINGERPRINT_HASH" --limit 1 --json --non-interactive); then
            echo "Could not query previous builds. Falling back to full native build."
            echo "needs_build=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "Looking for build with hash: ${{ steps.fingerprint.outputs.hash }}"
          HAS_BUILD=$(echo "$BUILD_JSON" | jq -r 'length > 0')
          if [ "$HAS_BUILD" = "true" ]; then
            echo "Fingerprint matched. Native code has not changed."
            echo "needs_build=false" >> $GITHUB_OUTPUT
          else
            echo "No matching build found for fingerprint. Native code has changed."
            echo "needs_build=true" >> $GITHUB_OUTPUT
          fi

      # ==========================================
      # PATH A: NATIVE CODE CHANGED (Build & Release)
      # ==========================================
      - name: 🚀 Build APK (Native Changes Detected)
        if: steps.check-build.outputs.needs_build == 'true'
        id: build-apk
        run: |
          set -euo pipefail
          echo "Starting full Android build..."
          BUILD_RES=$(eas build --platform android --profile production --non-interactive --json)
          ARTIFACT_URL=$(echo "$BUILD_RES" | jq -r 'if type == "array" then (.[0].artifacts.buildUrl // "") else (.artifacts.buildUrl // "") end')
          if [ "$ARTIFACT_URL" == "null" ] || [ -z "$ARTIFACT_URL" ]; then
            echo "Failed to extract build URL"
            exit 1
          fi
          echo "artifact_url=$ARTIFACT_URL" >> $GITHUB_OUTPUT

      - name: 📥 Download APK
        if: steps.check-build.outputs.needs_build == 'true'
        run: curl -L -o app-release.apk "${{ steps.build-apk.outputs.artifact_url }}"

      - name: 📦 Create GitHub Release
        if: steps.check-build.outputs.needs_build == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ github.run_number }}"
          name: "Release v${{ github.run_number }}"
          files: app-release.apk
          generate_release_notes: true
          fail_on_unmatched_files: true

      # ==========================================
      # PATH B: NO NATIVE CHANGES (OTA Update)
      # ==========================================
      - name: ⚡ Publish OTA Update (No Native Changes)
        if: steps.check-build.outputs.needs_build == 'false'
        run: |
          echo "Publishing OTA Update..."
          eas update --auto --branch production --platform android --non-interactive
