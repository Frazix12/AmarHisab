name: Maestro E2E

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      suite:
        description: "Suite to run"
        required: true
        default: "smoke"
        type: choice
        options:
          - smoke
          - regression

jobs:
  android-smoke:
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.event.inputs.suite == 'smoke')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Setup Expo + EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build Android APK for E2E
        run: eas build --platform android --profile e2e-android --non-interactive --wait

      - name: Download latest Android E2E build
        run: |
          ARTIFACT_URL=$(eas build:list --platform android --profile e2e-android --status finished --limit 1 --non-interactive --json | node -e "let data=''; process.stdin.on('data', c => data += c); process.stdin.on('end', () => { const builds = JSON.parse(data); process.stdout.write(builds[0]?.artifacts?.buildUrl || ''); });")
          if [ -z "$ARTIFACT_URL" ]; then
            echo "No Android artifact URL found for e2e-android profile"
            exit 1
          fi
          curl -L "$ARTIFACT_URL" -o app-e2e.apk

      - name: Install Maestro CLI
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH

      - name: Run Maestro smoke suite on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim
          script: |
            adb install -r app-e2e.apk
            maestro test -e APP_ID=com.frazix.amarisab --include-tags smoke .maestro/flows/smoke

      - name: Upload Maestro artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-smoke-artifacts
          path: maestro-output
          if-no-files-found: ignore

  android-regression:
    if: github.event_name == 'push' || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.suite == 'regression')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Setup Expo + EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build Android APK for E2E
        run: eas build --platform android --profile e2e-android --non-interactive --wait

      - name: Download latest Android E2E build
        run: |
          ARTIFACT_URL=$(eas build:list --platform android --profile e2e-android --status finished --limit 1 --non-interactive --json | node -e "let data=''; process.stdin.on('data', c => data += c); process.stdin.on('end', () => { const builds = JSON.parse(data); process.stdout.write(builds[0]?.artifacts?.buildUrl || ''); });")
          if [ -z "$ARTIFACT_URL" ]; then
            echo "No Android artifact URL found for e2e-android profile"
            exit 1
          fi
          curl -L "$ARTIFACT_URL" -o app-e2e.apk

      - name: Install Maestro CLI
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH

      - name: Run Maestro regression suite on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim
          script: |
            adb install -r app-e2e.apk
            maestro test -e APP_ID=com.frazix.amarisab --include-tags regression .maestro/flows/regression

      - name: Upload Maestro artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-regression-artifacts
          path: maestro-output
          if-no-files-found: ignore
