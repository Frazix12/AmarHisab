appId: com.frazix.amarisab
name: AI Settings And Templates
tags:
  - core
  - ai
  - templates

---
- killApp
- launchApp:
    clearState: true
- runFlow:
    when:
      visible: "(Skip|এড়িয়ে যান)"
    file: ../subflows/complete-onboarding.yaml
- runFlow: ../subflows/ensure-english.yaml
- runFlow: ../subflows/go-settings-tab.yaml
- tapOn: "AI"
- assertVisible: "AI & Smart Features"
- tapOn: "Smart Suggestions"
- tapOn: "Disable"
- tapOn: "Smart Suggestions"
- tapOn: "Enable"
- tapOn: "Manage Templates"
- assertVisible: "Templates"
- tapOn: "New Template"
- tapOn: "e.g., Eggs, Milk, Bread..."
- inputText: "E2E Template Rice"
- tapOn: "0.00"
- inputText: "120"
- tapOn: "Household"
- tapOn: "Save"
- assertVisible: "E2E Template Rice"
- tapOn: "Delete: E2E Template Rice"
- tapOn: "Delete"
- assertNotVisible: "E2E Template Rice"
- tapOn: "Manual.*"
- tapOn: "Learned.*"
- tapOn: "All.*"
- tapOn: "Back"
- assertVisible: "AI"
