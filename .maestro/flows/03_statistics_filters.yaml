appId: com.frazix.amarisab
name: Statistics Filters And Range
tags:
  - core
  - statistics

---
- killApp
- launchApp:
    clearState: true
- runFlow:
    when:
      visible: "(Skip|এড়িয়ে যান)"
    file: ../subflows/complete-onboarding.yaml
- runFlow: ../subflows/ensure-english.yaml
- runFlow: ../subflows/go-expenses-tab.yaml
- tapOn: "Add Expense"
- assertVisible: "Add Transaction"
- tapOn: "(0|০)(\\.00)?"
- inputText: "50"
- tapOn: "Optional description..."
- inputText: "E2E Stats Expense"
- tapOn: "Transport"
- tapOn: "(Save Transaction|Save|লেনদেন সংরক্ষণ করুন|সংরক্ষণ)"
- assertVisible: "(Amar Hisab|আমার খরচ)"
- runFlow: ../subflows/go-statistics-tab.yaml
- assertVisible: "Statistics"
- assertVisible: "By Category"
- assertVisible: "History"
- tapOn: "Custom month range"
- assertVisible: "Start month"
- tapOn: "Apply"
- assertNotVisible: "Start month"
- tapOn: "Next date range"
- tapOn: "Previous date range"
