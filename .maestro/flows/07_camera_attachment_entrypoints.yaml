appId: com.frazix.amarisab
name: Camera Attachment Entrypoints
tags:
  - core
  - camera

---
- killApp
- launchApp:
    clearState: true
- runFlow:
    when:
      visible: "(Skip|এড়িয়ে যান)"
    file: ../subflows/complete-onboarding.yaml
- runFlow: ../subflows/ensure-english.yaml
- runFlow: ../subflows/go-expenses-tab.yaml
- tapOn: "Add Expense"
- tapOn: "Take Photo"
- runFlow:
    when:
      visible: "Permission Required"
    commands:
      - assertVisible: "Allow Camera"
      - tapOn: "Cancel"
- runFlow:
    when:
      visible: "Close camera"
    commands:
      - tapOn: "Close camera"
- runFlow:
    when:
      visible: "Camera not available"
    commands:
      - tapOn: "Close"
- tapOn: "Cancel"
- assertVisible: "Amar Hisab"
